<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Maintenance</title>
    <link rel="stylesheet" href="stylesmm.css">
</head>
<body>
    <header>
        <h1>Machine Maintenance Notification System</h1>
    </header>
    <main>
        <section id="machines">
            <div class="machine">
                <img src="https://media.sciencephoto.com/image/t7450086/800wm/T7450086.jpg" alt="Machine 1">
                <button onclick="sendAlert('Machine 1')">Notify Maintenance</button>
            </div>
            <div class="machine">
                <img src="https://antares-global.com/wp-content/uploads/2020/01/4.jpg" alt="Machine 2">
                <button onclick="sendAlert('Machine 2')">Notify Maintenance</button>
            </div>
            <!-- Add more machines as needed -->
        </section>
      
      <section id="dashboard">
    <h2>Maintenance Dashboard</h2>
    <div id="notification-list"></div>
</section>
<section id="schedule">
    <h1>Schedule Maintenance</h1>

    <div class="machine">
        <!-- Machine 1 -->
        <label for="schedule-machine1">Schedule for Machine 1:</label>
        <input type="datetime-local" id="schedule-machine1">

        <button onclick="scheduleMaintenance(
            'Machine 1',
            document.getElementById('schedule-machine1').value
        )">
            Set Reminder
        </button>

        <br><br>

        <!-- Machine 2 -->
        <label for="schedule-machine2">Schedule for Machine 2:</label>
        <input type="datetime-local" id="schedule-machine2">

        <button onclick="scheduleMaintenance(
            'Machine 2',
            document.getElementById('schedule-machine2').value
        )">
            Set Reminder
        </button>
    </div>
</section>
<section id="reminders">
    <h2>Upcoming Reminders</h2>
    <div id="reminder-list"></div>
</section>
</main>
<script src="myscripts.js"></script>
</body>
</html>
